# OpenSpec project configuration for a Terraform module repository
# (template from the profiles repository, profile terraform-module).
# `context` is injected into every planning artifact; keep it to what is
# specific to THIS module. Engineering standards are not repeated here: they
# are fetched on demand from the referenced stores (quality, repository, terraform) (see the index that
# `openspec instructions` prints). `mise run spec-setup` registers the stores.
schema: spec-driven

# `ref` pins each store to a released tag (openspec-consumption); the setup
# script clones at that tag and reports a registered checkout on another commit.
references:
  - id: quality
    remote: https://gitlab.com/leminnov/agentic-coding/openspec/quality.git
    ref: v1.2.6
  - id: repository
    remote: https://gitlab.com/leminnov/agentic-coding/openspec/repository.git
    ref: v4.1.0
  - id: terraform
    remote: https://gitlab.com/leminnov/agentic-coding/openspec/terraform.git
    ref: v1.2.6

context: |
  Quality mandate: every artifact applies the non-negotiables of AGENTS.md
  (simple, efficient, secure, production-level) and cites the quality-store
  specs that decided something.

  Project: OpenTofu/Terraform module that manages Scaleway Secret Manager
  secrets and secret versions and Scaleway Key Manager keys in one project
  (resolved from `project_name` and `organization_id`). Published at
  `gitlab.com/leminnov/terraform/modules/scaleway-secrets-and-keys`; consumers
  pin it with `?ref=vX.Y.Z`. License: Apache-2.0.

  Stack: HCL only. required_version >= 1.11.0 (write-only arguments). Providers
  pinned with ~> in versions.tf: scaleway/scaleway ~> 2.86. Every tool is pinned
  in mise.toml.

  Layout: one .tf file per theme: main.tf (scaleway_secret,
  scaleway_secret_version, scaleway_key_manager_key, all `for_each` over
  maps), variables.tf, outputs.tf, locals.tf (project and ID maps), data.tf
  (scaleway_account_project lookup). There is no checks.tf. There is no tests/
  directory yet; new behaviour adds tests/main.tftest.hcl (run with `tofu
  test`). Examples live in examples/minimal and examples/complete.

  Module-specific conventions (the generic ones are standards in the
  quality, repository and terraform stores, fetched on demand): secret payloads
  go through the write-only `data_wo` + `data_wo_version` pair (exactly one of
  `data` or `data_wo` per version); README tables are generated by
  terraform-docs; CHANGELOG.md is generated by git-cliff (`mise run changelog`,
  `.cliff.toml`) from commit subjects, so a commit subject reads as its
  CHANGELOG line and the file is never edited by hand; semver applies.

  Commands: tofu fmt -recursive; tofu init -backend=false && tofu validate;
  tflint --recursive; tofu test (only once tests/ exists); pre-commit run -a;
  mise run changelog; mise run spec-validate; mise run spec-setup.

  Standards: fetch the referenced-store specs listed in these instructions
  whose id matches the area touched, and cite the ones applied.

rules:
  proposal:
    - Classify the change as semver major/minor/patch per terraform-versioning and list every input or output whose type, default or meaning changes
    - State what lands in state; a new secret-bearing input must follow terraform-security (write-only argument plus *_wo_version) or justify why it cannot
  specs:
    - Write requirements against the module's observable contract (input shape, validation errors, resources produced, outputs, check warnings, empty second plan), not against provider internals
    - Give every validation block and every check block a scenario with the rejected or warned input
  design:
    - Name the resources and arguments used and the provider version that introduced them
    - Explain how the change avoids a perpetual diff and how existing state migrates (moved blocks, in-place update or forced replacement)
    - Keep provider {} and backend {} out of the module and never shell out to a CLI
  tasks:
    - Include unit tests in tests/main.tftest.hcl (the directory does not exist yet; the first behaviour change creates it) and examples/complete plus any example the change affects
    - Include tofu fmt -recursive, tofu validate, tflint --recursive, tofu test and pre-commit run -a (terraform-docs README regeneration)
    - Include a commit subject that reads as the CHANGELOG.md line (git-cliff generates the file; do not edit it by hand), upgrade notes in the commit body for anything breaking, and README updates when the compatibility matrix or the what-lands-in-state table changes
    - Reuse the existing capability directories under openspec/specs (module-contract, secrets, secret-versions, encryption-keys) instead of creating near-duplicates

operations:
  apply:
    guidance:
      - Apply the quality store (simplicity, efficiency, security, production-readiness) to every task; fetch terraform-code-style, terraform-variables and terraform-outputs from the terraform store before editing HCL; flag any deviation with a DEVIATION(<spec-id>) comment
      - Run tofu fmt -recursive, tofu validate and tofu test (once tests/ exists) after each task group and do not mark a task done while they fail
      - Never run tofu apply against a real Scaleway project unless the user asked; say explicitly when it was skipped
      - Report test and scanner output as-is, including failures
  archive:
    guidance:
      - Confirm the commit subjects read as CHANGELOG lines (regenerate CHANGELOG.md with `mise run changelog` at release) and the terraform-docs README block was updated before archiving
      - Summarize which main specs changed and any requirement that was removed
